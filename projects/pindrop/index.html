<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PinDrop — Bagatelle</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080810;
      color: #e0e8f0;
      font-family: 'Segoe UI', system-ui, Arial, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding-bottom: 24px;
    }

    #app {
      width: 800px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(255,255,255,0.025);
      border-bottom: 1px solid rgba(240,192,64,0.25);
    }

    #logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 5px;
      color: #ffffff;
    }
    #logo span { color: #f0c040; }

    #balance-info {
      display: flex;
      gap: 28px;
      font-size: 13px;
      color: #667788;
    }
    #balance-info strong { color: #f0c040; font-size: 15px; }

    /* ── Canvas ──────────────────────────────────────────── */
    #gameCanvas {
      display: block;
      border-left:  1px solid rgba(255,255,255,0.06);
      border-right: 1px solid rgba(255,255,255,0.06);
      background: #0d0d1a;
    }

    /* ── Bet table ───────────────────────────────────────── */
    #bet-table {
      display: flex;
      align-items: stretch;
      gap: 3px;
      padding: 6px 4px;
      background: rgba(0,35,16,0.55);
      border-top:    1px solid rgba(0,180,70,0.18);
      border-bottom: 1px solid rgba(0,180,70,0.18);
    }

    .bet-num {
      height: 38px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      transition: transform 0.1s, border-color 0.1s, box-shadow 0.1s;
      line-height: 1;
    }
    .bet-num:hover:not(:disabled) {
      transform: scaleY(1.12);
      border-color: #f0c040;
      z-index: 1;
    }
    .bet-num.selected {
      border-color: #f0c040 !important;
      box-shadow: 0 0 12px rgba(240,192,64,0.6), inset 0 0 10px rgba(240,192,64,0.2);
    }
    .bet-num:disabled {
      opacity: 0.38;
      cursor: not-allowed;
      transform: none;
    }
    .bet-num.green  { background: #1a6b30; width: 38px; flex-shrink: 0; font-size: 14px; }
    .bet-num.red    { background: #7a1515; }
    .bet-num.black  { background: #181828; }

    #bet-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(3, 38px);
      gap: 3px;
      flex: 1;
    }

    /* ── Controls ────────────────────────────────────────── */
    #controls {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      background: rgba(0,0,0,0.35);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      flex-wrap: wrap;
    }

    #stake-area {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #556677;
    }

    #stake-btns {
      display: flex;
      gap: 5px;
    }

    .stake-btn {
      padding: 5px 13px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 4px;
      color: #99aabb;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.12s, color 0.12s, background 0.12s;
    }
    .stake-btn:hover:not(:disabled) { border-color: #f0c040; color: #f0c040; }
    .stake-btn.active {
      background: rgba(240,192,64,0.14);
      border-color: #f0c040;
      color: #f0c040;
    }
    .stake-btn:disabled { opacity: 0.38; cursor: not-allowed; }

    #drop-btn {
      padding: 9px 26px;
      background: linear-gradient(135deg, #c8a020, #f0c040);
      border: none;
      border-radius: 5px;
      color: #0d0d1a;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
      text-transform: uppercase;
    }
    #drop-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #d4aa28, #ffe060);
      transform: translateY(-2px);
      box-shadow: 0 5px 22px rgba(240,192,64,0.45);
    }
    #drop-btn:disabled { opacity: 0.28; cursor: not-allowed; transform: none; box-shadow: none; }

    #status-msg {
      margin-left: auto;
      font-size: 12px;
      color: #556677;
      font-style: italic;
      max-width: 260px;
      text-align: right;
    }

    /* ── Payout table reference ──────────────────────────── */
    #payout-ref {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.018);
      border-top: 1px solid rgba(255,255,255,0.05);
      flex-wrap: wrap;
    }
    .pref {
      font-size: 11px;
      color: #445566;
    }
    .pref strong { color: #f0c040; margin-left: 3px; }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 820px) {
      body { padding: 0; }
      #app { width: 100%; }
      #gameCanvas { width: 100%; height: auto; }
      #bet-grid { grid-template-columns: repeat(12, 1fr); }
    }
  </style>
</head>
<body>
  <div id="app">

    <header>
      <div id="logo">PIN<span>DROP</span></div>
      <div id="balance-info">
        <span>Balance: <strong>£<span id="balance-val">100.00</span></strong></span>
        <span>Last win: <strong>£<span id="lastwin-val">0.00</span></strong></span>
      </div>
    </header>

    <canvas id="gameCanvas" width="800" height="460"></canvas>

    <div id="bet-table"></div>

    <div id="controls">
      <div id="stake-area">
        <span>Stake:</span>
        <div id="stake-btns"></div>
      </div>
      <button id="drop-btn" disabled>DROP BALL</button>
      <div id="status-msg">Loading…</div>
    </div>

    <div id="payout-ref">
      <span class="pref">0 balls <strong>70×</strong></span>
      <span class="pref">1 ball <strong>15×</strong></span>
      <span class="pref">2 balls <strong>20×</strong></span>
      <span class="pref">3 balls <strong>30×</strong></span>
      <span class="pref">4 balls <strong>50×</strong></span>
      <span class="pref">5+ balls <strong>100×</strong></span>
    </div>

  </div>

  <!-- Matter.js physics engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script src="config.js"></script>
  <script src="physics.js"></script>
  <script src="betting.js"></script>
  <script src="renderer.js"></script>
  <script src="ui.js"></script>
  <script src="game.js"></script>
</body>
</html>
