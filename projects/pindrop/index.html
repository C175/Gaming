<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PinDrop — Bagatelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#060610;color:#e0e8f0;font-family:'Exo 2',system-ui,Arial,sans-serif;
  display:flex;justify-content:center;min-height:100vh;padding-bottom:24px;overflow-x:hidden}
#app{max-width:800px;width:100%;display:flex;flex-direction:column;align-items:stretch;
  box-shadow:0 0 80px rgba(0,0,0,0.8)}

/* ── Header ─────────────────────────────────────────────── */
header{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;
  background:linear-gradient(180deg,rgba(20,25,50,0.95) 0%,rgba(10,12,30,0.95) 100%);
  border-bottom:1px solid rgba(240,192,64,0.3);position:relative;overflow:hidden}
header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(240,192,64,0.6),transparent)}
#logo{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;letter-spacing:6px;
  background:linear-gradient(90deg,#fff 0%,#f0c040 20%,#fffbe0 40%,#f0c040 60%,#fff 80%,#f0c040 100%);
  background-size:200% 100%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:shimmer 4s infinite linear}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
#balance-info{display:flex;gap:28px;font-size:13px;color:#667788;font-family:'Exo 2',sans-serif}
#balance-info strong{color:#f0c040;font-size:15px;font-weight:700}

/* ── Demo badge ─────────────────────────────────────────── */
#demo-badge{font-size:10px;font-family:'Exo 2',sans-serif;letter-spacing:1px;
  color:#8899aa;border:1px solid rgba(240,192,64,0.25);border-radius:4px;
  padding:4px 10px;background:rgba(240,192,64,0.06);white-space:nowrap;
  text-transform:uppercase;font-weight:600;flex-shrink:0}

/* ── Canvas ─────────────────────────────────────────────── */
#gameCanvas{display:block;width:100%;height:auto;
  border-left:1px solid rgba(255,255,255,0.05);
  border-right:1px solid rgba(255,255,255,0.05)}

/* ── Bet table ──────────────────────────────────────────── */
#bet-table{display:flex;align-items:stretch;gap:3px;padding:6px 4px;
  background:linear-gradient(180deg,rgba(0,30,12,0.7) 0%,rgba(0,20,8,0.85) 100%);
  border-top:1px solid rgba(0,160,60,0.2);border-bottom:1px solid rgba(0,160,60,0.2)}
.bet-num{height:38px;border:1px solid rgba(255,255,255,0.12);border-radius:3px;cursor:pointer;
  font-size:11px;font-weight:700;color:#fff;font-family:'Exo 2',sans-serif;
  transition:transform .1s,border-color .12s,box-shadow .12s,background .12s;line-height:1;
  position:relative;overflow:hidden}
.bet-num:hover:not(:disabled){transform:scaleY(1.13);border-color:#f0c040;z-index:1}
.bet-num.selected{border-color:#f0c040!important;background:#7a5500!important;
  box-shadow:0 0 14px rgba(240,192,64,.65),inset 0 0 12px rgba(240,192,64,.2);
  animation:pulse-sel 1.2s ease-in-out infinite}
@keyframes pulse-sel{0%,100%{box-shadow:0 0 10px rgba(240,192,64,.5),inset 0 0 8px rgba(240,192,64,.15)}
  50%{box-shadow:0 0 20px rgba(240,192,64,.8),inset 0 0 14px rgba(240,192,64,.3)}}
/* Hot number flame effect */
.bet-num.hot{border-color:#ff6600!important;animation:flame-btn 0.7s ease-in-out infinite!important}
.bet-num.hot.selected{animation:flame-sel 0.7s ease-in-out infinite!important}
@keyframes flame-btn{
  0%,100%{box-shadow:0 0 6px #ff4400,0 -3px 10px #ff8800;border-color:#ff6600}
  50%{box-shadow:0 0 14px #ff6600,0 -7px 18px #ffaa00;border-color:#ffaa00}}
@keyframes flame-sel{
  0%,100%{box-shadow:0 0 10px #ff4400,0 -3px 12px #ff8800,inset 0 0 8px rgba(255,100,0,.25)}
  50%{box-shadow:0 0 20px #ff6600,0 -8px 22px #ffaa00,inset 0 0 14px rgba(255,160,0,.35)}}
.bet-num:disabled{opacity:.35;cursor:not-allowed;transform:none;animation:none}
.bet-num.locked{pointer-events:none;cursor:default}
.stake-btn.locked{pointer-events:none;opacity:.45;cursor:default}
.bet-num.green{background:linear-gradient(180deg,#1e7835,#145225);width:38px;flex-shrink:0;font-size:14px}
.bet-num.red{background:linear-gradient(180deg,#8a1a1a,#5a0e0e)}
.bet-num.black{background:linear-gradient(180deg,#1e1e30,#111118)}
#bet-grid{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(3,38px);gap:3px;flex:1}

/* ── Controls ───────────────────────────────────────────── */
#controls{display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:linear-gradient(180deg,rgba(8,8,20,0.95),rgba(5,5,14,0.98));
  border-bottom:1px solid rgba(255,255,255,.05);flex-wrap:wrap}
#stake-area{display:flex;align-items:center;gap:8px;font-size:12px;color:#556677}
#stake-btns{display:flex;gap:4px;flex-wrap:wrap}
.stake-btn{padding:5px 10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);
  border-radius:4px;color:#8899aa;font-size:12px;font-weight:600;font-family:'Exo 2',sans-serif;cursor:pointer;
  transition:border-color .12s,color .12s,background .12s}
.stake-btn:hover:not(:disabled){border-color:#f0c040;color:#f0c040}
.stake-btn.active{background:rgba(240,192,64,.14);border-color:#f0c040;color:#f0c040}
.stake-btn:disabled{opacity:.35;cursor:not-allowed}
#drop-btn{padding:9px 22px;background:linear-gradient(135deg,#b8920e,#f0c040,#b8920e);
  background-size:200% 100%;border:none;border-radius:5px;color:#0a0a18;font-size:14px;font-weight:900;
  font-family:'Orbitron',sans-serif;letter-spacing:2px;cursor:pointer;
  transition:transform .12s,box-shadow .12s,background-position .4s;text-transform:uppercase;white-space:nowrap}
#drop-btn:hover:not(:disabled){background-position:100% 0;transform:translateY(-2px);
  box-shadow:0 5px 25px rgba(240,192,64,.5)}
#drop-btn:active:not(:disabled){transform:translateY(0)}
#drop-btn:disabled{opacity:.25;cursor:not-allowed;transform:none;box-shadow:none}
#bet-info{font-size:12px;color:#667788;white-space:nowrap}
#bet-info span{color:#f0c040;font-weight:700}
#clear-btn{padding:5px 10px;background:rgba(255,50,50,.06);border:1px solid rgba(255,80,80,.22);
  border-radius:4px;color:#bb5555;font-size:11px;font-family:'Exo 2',sans-serif;cursor:pointer;white-space:nowrap;
  transition:border-color .12s,color .12s,background .12s}
#clear-btn:hover:not(:disabled){border-color:#ff7777;color:#ff9999;background:rgba(255,50,50,.12)}
#clear-btn:disabled{opacity:.28;cursor:not-allowed}
#rebet-btn{padding:5px 10px;background:rgba(240,192,64,.07);border:1px solid rgba(240,192,64,.28);
  border-radius:4px;color:#c8a030;font-size:11px;font-family:'Exo 2',sans-serif;cursor:pointer;white-space:nowrap;
  transition:border-color .12s,color .12s,background .12s}
#rebet-btn:hover:not(:disabled){border-color:#f0c040;color:#f0c040;background:rgba(240,192,64,.14)}
#rebet-btn:disabled{opacity:.28;cursor:not-allowed}
/* Heat meter */
#heat-wrap{display:flex;align-items:center;gap:6px;margin-left:4px}
#heat-label{font-size:10px;font-family:'Orbitron',sans-serif;letter-spacing:1px;color:#554422;
  white-space:nowrap;transition:color .3s}
#heat-label.hot{color:#ff8800;text-shadow:0 0 8px #ff6600}
#heat-track{width:64px;height:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
  border-radius:4px;overflow:hidden}
#heat-fill{height:100%;width:0%;border-radius:4px;transition:width .4s,background .4s;
  background:linear-gradient(90deg,#442200,#884400)}
#status-msg{margin-left:auto;font-size:12px;color:#556677;font-style:italic;max-width:200px;text-align:right}

/* ── Payout ref ─────────────────────────────────────────── */
#payout-ref{display:flex;justify-content:center;gap:14px;padding:8px 16px;
  background:rgba(255,255,255,.015);border-top:1px solid rgba(255,255,255,.04);flex-wrap:wrap}
.pref{font-size:11px;color:#3d5066;font-family:'Exo 2',sans-serif}
.pref strong{color:#f0c040;margin-left:3px}
.pref.hot-ref strong{color:#ff8800}
.pref.bolt-ref{color:#4466aa}.pref.bolt-ref strong{color:#aaddff}
/* Lightning bolt multiplier */
@keyframes bolt-strike{
  0%  {background:rgba(220,235,255,0.97);box-shadow:0 0 32px 10px rgba(140,190,255,1),inset 0 0 20px rgba(200,220,255,0.9)}
  12% {background:rgba(80,120,255,0.25); box-shadow:0 0 8px rgba(120,170,255,0.4)}
  22% {background:rgba(220,235,255,0.92);box-shadow:0 0 28px 8px rgba(140,190,255,0.95),inset 0 0 16px rgba(200,220,255,0.7)}
  42% {background:rgba(60,100,200,0.18); box-shadow:0 0 12px rgba(120,170,255,0.5)}
  100%{background:rgba(30,60,160,0.12);  box-shadow:0 0 10px rgba(100,160,255,0.35)}}
.bet-num.bolt-strike{animation:bolt-strike 0.55s ease-out forwards!important;
  border-color:#88c8ff!important;color:#fff!important}
.bet-num.bolt-lit{border-color:#5599dd!important;
  box-shadow:0 0 10px rgba(100,180,255,0.5),inset 0 0 8px rgba(100,180,255,0.12)!important}
.bet-num.bolt-lit::after{content:attr(data-lmult);position:absolute;top:1px;right:2px;
  font-size:8px;font-weight:900;font-family:'Orbitron',sans-serif;
  color:#aaddff;text-shadow:0 0 4px #88bbff;line-height:1;pointer-events:none}

/* ── Autoplay ───────────────────────────────────────────────── */
#autoplay-area{display:flex;align-items:center;gap:6px;font-size:12px;color:#556677;margin-left:6px}
#autoplay-btns{display:flex;gap:3px}
.ap-btn{padding:4px 8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  border-radius:4px;color:#778899;font-size:11px;font-weight:600;font-family:'Exo 2',sans-serif;cursor:pointer;
  transition:border-color .12s,color .12s,background .12s}
.ap-btn:hover{border-color:#f0c040;color:#f0c040}
.ap-btn.active{background:rgba(240,192,64,.14);border-color:#f0c040;color:#f0c040}
#ap-start{padding:5px 11px;background:rgba(80,200,100,.08);border:1px solid rgba(80,200,100,.28);
  border-radius:4px;color:#66cc88;font-size:11px;font-weight:700;font-family:'Exo 2',sans-serif;
  cursor:pointer;white-space:nowrap;transition:border-color .12s,color .12s,background .12s}
#ap-start:hover:not(:disabled){border-color:#88ffaa;color:#aaffcc;background:rgba(80,200,100,.16)}
#ap-start.stopping{border-color:rgba(255,80,80,.4);color:#ff7777;background:rgba(255,50,50,.08)}
#ap-start:disabled{opacity:.28;cursor:not-allowed}

/* ── History ───────────────────────────────────────────────── */
#history-strip{padding:8px 14px 10px;
  background:rgba(0,0,0,.25);border-top:1px solid rgba(255,255,255,.04)}
#history-label{font-size:10px;font-family:'Orbitron',sans-serif;letter-spacing:2px;
  color:#2a3a4a;margin-bottom:6px}
#history-rows{display:flex;flex-direction:column;gap:3px}
.h-row{display:flex;align-items:center;gap:8px;font-size:11px;font-family:'Exo 2',sans-serif;
  padding:3px 6px;border-radius:3px;background:rgba(255,255,255,.025);
  animation:h-slide-in .25s ease-out}
@keyframes h-slide-in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.h-round{color:#2a3d50;font-size:10px;min-width:22px}
.h-ball{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:900;flex-shrink:0}
.h-ball.red{background:#8a1a1a;color:#ffaaaa}
.h-ball.black{background:#222230;color:#aabbcc}
.h-ball.green{background:#1e7835;color:#aaffcc}
.h-landed{color:#667788;font-size:11px}
.h-result{margin-left:auto;font-weight:700;font-size:11px}
.h-result.win{color:#f0c040}
.h-result.miss{color:#555566}
.h-tags{font-size:9px;color:#446688;display:flex;gap:3px}
.h-tags span{padding:1px 4px;border-radius:2px;background:rgba(255,255,255,.05)}

@media(max-width:820px){
  body{padding:0}
  header{padding:10px 14px;flex-wrap:wrap;gap:8px}
  #logo{font-size:20px;letter-spacing:3px}
  #demo-badge{font-size:9px;padding:3px 7px}
  #balance-info{font-size:11px;gap:14px}
}
@media(max-width:540px){
  header{padding:8px 10px;gap:6px}
  #logo{font-size:16px;letter-spacing:2px}
  #demo-badge{display:none} /* too cramped — hide on very small screens */
  #balance-info{font-size:10px;gap:8px}
  #balance-info strong{font-size:12px}
  #bet-table{padding:4px 2px;gap:2px}
  #bet-grid{grid-template-columns:repeat(12,1fr);gap:2px}
  .bet-num{height:30px;font-size:9px}
  .bet-num.green{width:28px}
  #controls{padding:7px 8px;gap:6px}
  #stake-btns{gap:3px}
  .stake-btn{padding:4px 7px;font-size:11px}
  #drop-btn{padding:7px 14px;font-size:12px}
  #status-msg{max-width:100%;text-align:left;margin-left:0;width:100%}
  #payout-ref{gap:8px;padding:6px 8px}
  .pref{font-size:10px}
  #history-strip{padding:6px 10px 8px}
  #autoplay-area{flex-wrap:wrap}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="logo">PINDROP</div>
    <div id="demo-badge">Demo Mode — Play Money</div>
    <div id="balance-info">
      <span>Balance: <strong>£<span id="balance-val">100.00</span></strong></span>
      <span>Last win: <strong>£<span id="lastwin-val">0.00</span></strong></span>
    </div>
  </header>
  <canvas id="gameCanvas" width="800" height="460"></canvas>
  <div id="bet-table"></div>
  <div id="controls">
    <div id="stake-area"><span>Stake:</span><div id="stake-btns"></div></div>
    <div id="bet-info">Bet: <span id="bet-total">£0.00</span></div>
    <button id="rebet-btn" disabled>↩ Rebet</button>
    <button id="clear-btn" disabled>Clear</button>
    <button id="drop-btn" disabled>DROP BALL</button>
    <div id="autoplay-area">
      <span>Auto:</span>
      <div id="autoplay-btns">
        <button class="ap-btn" data-rounds="5">5</button>
        <button class="ap-btn" data-rounds="10">10</button>
        <button class="ap-btn" data-rounds="25">25</button>
        <button class="ap-btn" data-rounds="50">50</button>
      </div>
      <button id="ap-start" disabled title="Repeats your current numbers and stake for each round">▶ Start</button>
    </div>
    <div id="heat-wrap">
      <span id="heat-label">HEAT</span>
      <div id="heat-track"><div id="heat-fill"></div></div>
    </div>
    <div id="status-msg">Select numbers and drop!</div>
  </div>
  <div id="payout-ref">
    <span class="pref">0 balls <strong>65×</strong></span>
    <span class="pref">1 ball <strong>15×</strong></span>
    <span class="pref">2 balls <strong>20×</strong></span>
    <span class="pref">3 balls <strong>30×</strong></span>
    <span class="pref">4 balls <strong>50×</strong></span>
    <span class="pref">5+ balls <strong>100×</strong></span>
    <span class="pref hot-ref" id="hot-ref" style="display:none">🔥 HOT <strong>1.5×</strong></span>
    <span class="pref bolt-ref">⚡ BOLT <strong>2–5×</strong></span>
  </div>
  <div id="history-strip">
    <div id="history-label">ROUND HISTORY</div>
    <div id="history-rows"></div>
  </div>
</div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
const CONFIG = {
  branding:  { primaryColour: '#f0c040', backgroundColor: '#0b0b1c' },
  gameplay:  { stakeOptions: [0.20,0.50,1,2,5,10], startingBalance: 100,
               stage2BallCount: 50, stage2BallInterval: 200 },
  rtp:       { payoutTable: { 0:65,1:15,2:20,3:30,4:50,5:100 } },
  // Hot numbers: declared promotional feature — activates 1-2 numbers for 12s
  // every 45-75s. Multiplies payout by 1.5× if bet number is hot when hit.
  // Increases RTP during activation window by ~50% of the base rate.
  hotNumbers: { enabled: true, minInterval: 45000, maxInterval: 75000, duration: 12000, multiplier: 1.5 },
  heat:       { maxMisses: 10, nudgeStart: 6 }, // pseudo-random nudge after N misses
};

// ─── PHYSICS ─────────────────────────────────────────────────────────────────
class PhysicsBall {
  constructor(x, y, r) {
    this.x=x; this.y=y; this.r=r;
    this.vx=(Math.random()-0.5)*0.5; this.vy=0;
    this.active=true; this.settled=false;
    this.removed=false; this.slotIndex=-1;
    this.isCascade=false; this.processed=false;
    this.trail=[];
  }
}

const GRAVITY=0.238, AIR_FRIC=0.9985, SUBSTEPS=3;

function resolvePin(ball, pin) {
  const dx=ball.x-pin.x, dy=ball.y-pin.y;
  const d2=dx*dx+dy*dy, minD=ball.r+pin.r;
  if (d2>=minD*minD) return;
  const d=Math.sqrt(d2)||0.001;
  const nx=dx/d, ny=dy/d;
  ball.x+=nx*(minD-d); ball.y+=ny*(minD-d);
  const dot=ball.vx*nx+ball.vy*ny;
  if (dot<0) {
    pin.hitTime=performance.now();
    ball.vx-=(1+pin.rest)*dot*nx+(Math.random()-0.5)*0.2;
    ball.vy-=(1+pin.rest)*dot*ny;
    const spd=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
    Sound.tick(spd);
  }
}

function resolveRect(ball, rect) {
  const cx=Math.max(rect.x,Math.min(ball.x,rect.x+rect.w));
  const cy=Math.max(rect.y,Math.min(ball.y,rect.y+rect.h));
  const dx=ball.x-cx, dy=ball.y-cy, d2=dx*dx+dy*dy;
  if (d2>=ball.r*ball.r) return;
  const d=Math.sqrt(d2)||0.001;
  const nx=dx/d, ny=dy/d;
  ball.x+=nx*(ball.r-d); ball.y+=ny*(ball.r-d);
  const dot=ball.vx*nx+ball.vy*ny;
  if (dot<0) { ball.vx-=(1.46)*dot*nx; ball.vy-=(1.46)*dot*ny; }
}

function stepPhysics(balls, pins, rects) {
  const g=GRAVITY/SUBSTEPS;
  for (let s=0;s<SUBSTEPS;s++) {
    for (const ball of balls) {
      if (!ball.active||ball.removed) continue;
      ball.vy+=g; ball.vx*=AIR_FRIC; ball.vy*=AIR_FRIC;
      ball.x+=ball.vx/SUBSTEPS; ball.y+=ball.vy/SUBSTEPS;
      for (const pin  of pins)  resolvePin(ball,pin);
      for (const rect of rects) resolveRect(ball,rect);
    }
  }
  for (const ball of balls) {
    if (ball.removed) continue;
    ball.trail.push({x:ball.x,y:ball.y});
    if (ball.trail.length>10) ball.trail.shift();
  }
}

// ─── WORLD ───────────────────────────────────────────────────────────────────
const CW=800, CH=460, SLOT_TOP=368, SLOT_N=37, SLOT_W=CW/SLOT_N;
const PIN_R=6, BALL_R=8;
const PIN_SPACING_X=74, PIN_SPACING_Y=34, GRID_TOP=36;

const PINS=[];
for (let row=1;row<=10;row++) {
  const y=GRID_TOP+(row-1)*PIN_SPACING_Y;
  const startX=CW/2-(row-1)*PIN_SPACING_X/2;
  for (let col=0;col<row;col++)
    PINS.push({
      x:startX+col*PIN_SPACING_X, y, r:PIN_R,
      hitTime:0,
      rest: 0.38+Math.random()*0.16, // per-pin restitution 0.38–0.54
    });
}

const RECTS=[
  {x:-12,y:0,w:12,h:CH+20},{x:CW,y:0,w:12,h:CH+20},{x:0,y:CH,w:CW,h:12},
];
for (let i=1;i<SLOT_N;i++) RECTS.push({x:i*SLOT_W-1.5,y:SLOT_TOP,w:3,h:CH-SLOT_TOP+12});

const SLOT_NUMBERS=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,
                    24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const NUMBER_TO_SLOT={};
SLOT_NUMBERS.forEach((n,i)=>{NUMBER_TO_SLOT[n]=i;});
function getSlotIndex(x){return Math.max(0,Math.min(SLOT_N-1,Math.floor(x/SLOT_W)));}

// ─── BETTING ─────────────────────────────────────────────────────────────────
const RED_N=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
let balance=CONFIG.gameplay.startingBalance, stake=1, selNums=new Set(), lastWin=0;
function totalBet(){return +(stake*selNums.size).toFixed(2);}
function canAfford(){return selNums.size>0&&balance>=totalBet();}
function placeBets(){if(!canAfford())return false;balance=+(balance-totalBet()).toFixed(2);return true;}
function calcPayout(ballCount, isHot, lightMult) {
  const base=CONFIG.rtp.payoutTable[Math.min(ballCount,5)];
  let mult=isHot ? Math.round(base*CONFIG.hotNumbers.multiplier) : base;
  if (lightMult>1) mult=Math.round(mult*lightMult);
  const win=+(stake*mult).toFixed(2);
  lastWin=win; balance=+(balance+win).toFixed(2);
  return {mult,win,isHot,lightMult};
}

// ─── LIGHTNING MULTIPLIERS ───────────────────────────────────────────────────
// Map of { number → multiplier (2-5) } — refreshed each round before drop
let lightningNums=new Map();

function clearLightningUI(){
  document.querySelectorAll('.bolt-lit,.bolt-strike').forEach(b=>{
    b.classList.remove('bolt-lit','bolt-strike');
    delete b.dataset.lmult;
  });
  canvasBolts.length=0;
  lightningOverlay.alpha=0;
}

function makeBolt(targetSlotX, jitterScale){
  const jitter=jitterScale||100;
  const x0=CW/2+(Math.random()-0.5)*180;
  const y0=-12;
  const x1=targetSlotX+(Math.random()-0.5)*SLOT_W*0.5;
  const y1=SLOT_TOP-4;
  const pts=[{x:x0,y:y0}];
  const segs=16;
  for(let i=1;i<segs;i++){
    const t=i/segs, j=(1-t)*jitter*(Math.random()-0.5);
    pts.push({x:x0+(x1-x0)*t+j, y:y0+(y1-y0)*t});
  }
  pts.push({x:x1,y:y1});
  return pts;
}

function fireBolt(num, mult){
  const btn=document.querySelector(`[data-num="${num}"]`);
  if(btn){
    btn.dataset.lmult=`${mult}×`;
    btn.classList.remove('bolt-strike');
    void btn.offsetWidth;
    btn.classList.add('bolt-strike','bolt-lit');
  }
  const slotX=(NUMBER_TO_SLOT[num]+0.5)*SLOT_W;
  // Main bolt
  canvasBolts.push({pts:makeBolt(slotX,110),born:performance.now(),thick:true});
  // Two forks — slightly narrower jitter, staggered
  setTimeout(()=>canvasBolts.push({pts:makeBolt(slotX,75),born:performance.now(),thick:false}),55);
  setTimeout(()=>canvasBolts.push({pts:makeBolt(slotX,60),born:performance.now(),thick:false}),120);
  // Cap flash at 0.35 — visible but not a strobe
  boltFlash=Math.min(0.35,boltFlash+0.35);
  shakeDecay=Math.max(shakeDecay,0.7);
  Sound.zap();
}

function animateLightning(entries,i,done){
  if(i>=entries.length){
    // All bolts struck — thunder and let it breathe
    boltFlash=Math.max(boltFlash,0.3);
    Sound.thunder();
    setTimeout(()=>{
      lightningOverlay.alpha=0;
      done();
    },650);
    return;
  }
  fireBolt(...entries[i]);
  setTimeout(()=>animateLightning(entries,i+1,done),580);
}

// ─── HOT NUMBERS ─────────────────────────────────────────────────────────────
let hotNums=new Set();
let hotExpiry=0;

function activateHotNumbers() {
  // Clear previous
  hotNums.forEach(n=>document.querySelector(`[data-num="${n}"]`)?.classList.remove('hot'));
  hotNums.clear();
  document.getElementById('hot-ref').style.display='none';

  if (!CONFIG.hotNumbers.enabled) { scheduleNextHot(); return; }

  // Pick 1–2 numbers that are NOT currently in play
  const pool=Array.from({length:37},(_,i)=>i).filter(n=>!selNums.has(n));
  const count=Math.random()<0.3?2:1;
  for (let i=0;i<count&&pool.length;i++) {
    const idx=Math.floor(Math.random()*pool.length);
    hotNums.add(pool.splice(idx,1)[0]);
  }
  hotExpiry=Date.now()+CONFIG.hotNumbers.duration;

  hotNums.forEach(n=>{
    const btn=document.querySelector(`[data-num="${n}"]`);
    if (btn) btn.classList.add('hot');
  });
  document.getElementById('hot-ref').style.display='';

  setTimeout(()=>{
    hotNums.forEach(n=>document.querySelector(`[data-num="${n}"]`)?.classList.remove('hot'));
    hotNums.clear(); hotExpiry=0;
    document.getElementById('hot-ref').style.display='none';
    scheduleNextHot();
  }, CONFIG.hotNumbers.duration);
}

function scheduleNextHot() {
  const {minInterval,maxInterval}=CONFIG.hotNumbers;
  setTimeout(activateHotNumbers, minInterval+Math.random()*(maxInterval-minInterval));
}

// ─── HEAT METER ──────────────────────────────────────────────────────────────
let consecutiveMisses=0;
const MAX_HEAT=CONFIG.heat.maxMisses;

function updateHeatMeter() {
  const pct=Math.min(1,consecutiveMisses/MAX_HEAT);
  const fill=document.getElementById('heat-fill');
  const label=document.getElementById('heat-label');
  fill.style.width=(pct*100)+'%';
  if (pct>=0.9) {
    fill.style.background='linear-gradient(90deg,#882200,#ff4400,#ff8800)';
    label.classList.add('hot');
  } else if (pct>=0.5) {
    fill.style.background='linear-gradient(90deg,#663300,#cc5500,#ff8800)';
    label.classList.remove('hot');
  } else {
    fill.style.background='linear-gradient(90deg,#442200,#884400)';
    label.classList.remove('hot');
  }
}

// ─── PARTICLES ───────────────────────────────────────────────────────────────
const particles=[];
const CONFETTI_COLS =['#f0c040','#ff6644','#44ffaa','#ff44aa','#44aaff','#ffffff','#ffaa44'];
const HOT_WIN_COLS  =['#ff4400','#ff8800','#ffcc00','#ffffff','#ff6600','#ffaa00'];

function spawnParticles(x, y, count, cols) {
  const palette=cols||CONFETTI_COLS;
  for (let i=0;i<count;i++) {
    const angle=Math.random()*Math.PI*2;
    const speed=3+Math.random()*9;
    particles.push({
      x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-4,
      color:palette[Math.floor(Math.random()*palette.length)],
      life:1,decay:0.012+Math.random()*0.018,
      r:2+Math.random()*4,rot:Math.random()*Math.PI*2,rotV:(Math.random()-0.5)*0.3,
    });
  }
}

function updateParticles() {
  for (const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.vx*=0.97;p.life-=p.decay;p.rot+=p.rotV;}
  for (let i=particles.length-1;i>=0;i--) if(particles[i].life<=0) particles.splice(i,1);
}

// ─── SOUND ───────────────────────────────────────────────────────────────────
const Sound=(()=>{
  let ac=null;
  function init(){
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    return ac;
  }
  function mkNoise(c,dur){
    const n=Math.ceil(c.sampleRate*dur),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    return buf;
  }
  function zap(){
    const c=init(),t=c.currentTime;
    // Crack: shaped white noise
    const buf=mkNoise(c,0.25),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]*=Math.exp(-i/(d.length*0.08));
    const src=c.createBufferSource();src.buffer=buf;
    const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=3800;bp.Q.value=0.6;
    const g=c.createGain();g.gain.setValueAtTime(0.75,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.25);
    src.connect(bp);bp.connect(g);g.connect(c.destination);src.start(t);src.stop(t+0.25);
    // Electric buzz sweep
    const osc=c.createOscillator();osc.type='sawtooth';
    osc.frequency.setValueAtTime(260,t);osc.frequency.exponentialRampToValueAtTime(50,t+0.14);
    const og=c.createGain();og.gain.setValueAtTime(0.22,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.16);
    osc.connect(og);og.connect(c.destination);osc.start(t);osc.stop(t+0.16);
  }
  function thunder(){
    const c=init(),t=c.currentTime;
    const buf=mkNoise(c,2),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]*=Math.exp(-i/(d.length*0.32))*(1+0.4*Math.sin(i*0.007));
    const src=c.createBufferSource();src.buffer=buf;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=180;
    const g=c.createGain();g.gain.setValueAtTime(0.6,t);g.gain.exponentialRampToValueAtTime(0.001,t+2);
    src.connect(lp);lp.connect(g);g.connect(c.destination);src.start(t);src.stop(t+2);
  }
  function whoosh(){
    const c=init(),t=c.currentTime;
    const osc=c.createOscillator();osc.type='sine';
    osc.frequency.setValueAtTime(420,t);osc.frequency.exponentialRampToValueAtTime(65,t+0.5);
    const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.3,t+0.07);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    osc.connect(g);g.connect(c.destination);osc.start(t);osc.stop(t+0.5);
  }
  function win(){
    const c=init(),t=c.currentTime;
    [0,4,7,12].forEach((semi,i)=>{
      const freq=440*Math.pow(2,semi/12);
      const osc=c.createOscillator();osc.type='triangle';osc.frequency.value=freq;
      const g=c.createGain();
      g.gain.setValueAtTime(0,t+i*0.11);g.gain.linearRampToValueAtTime(0.16,t+i*0.11+0.05);
      g.gain.exponentialRampToValueAtTime(0.001,t+i*0.11+0.55);
      osc.connect(g);g.connect(c.destination);osc.start(t+i*0.11);osc.stop(t+i*0.11+0.55);
    });
  }
  let lastTick=0;
  function tick(speed){
    const now=Date.now();
    if(now-lastTick<55)return;
    lastTick=now;
    const c=init(),t=c.currentTime;
    const freq=420+Math.min(speed,12)*28;
    const osc=c.createOscillator();osc.type='triangle';osc.frequency.value=freq;
    const g=c.createGain();g.gain.setValueAtTime(0.18,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.07);
    osc.connect(g);g.connect(c.destination);osc.start(t);osc.stop(t+0.07);
    const buf=mkNoise(c,0.05),d2=buf.getChannelData(0);
    for(let i=0;i<d2.length;i++)d2[i]*=Math.exp(-i/(d2.length*0.15));
    const src=c.createBufferSource();src.buffer=buf;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
    const g2=c.createGain();g2.gain.setValueAtTime(0.1,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.05);
    src.connect(lp);lp.connect(g2);g2.connect(c.destination);src.start(t);src.stop(t+0.05);
  }

  // Ball settling into a slot — soft low thud
  let lastLand=0;
  function land(){
    const now=Date.now();
    if(now-lastLand<40)return; // cap during cascade
    lastLand=now;
    const c=init(),t=c.currentTime;
    // Thud: pitched noise decay
    const buf=mkNoise(c,0.12),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]*=Math.exp(-i/(d.length*0.12));
    const src=c.createBufferSource();src.buffer=buf;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;
    const g=c.createGain();g.gain.setValueAtTime(0.28,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
    src.connect(lp);lp.connect(g);g.connect(c.destination);src.start(t);src.stop(t+0.12);
    // Subtle mid click on top
    const osc=c.createOscillator();osc.type='sine';osc.frequency.value=180;
    const og=c.createGain();og.gain.setValueAtTime(0.12,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.06);
    osc.connect(og);og.connect(c.destination);osc.start(t);osc.stop(t+0.06);
  }

  // Stage 1 hit — rising pinball activation cascade
  function activate(){
    const c=init(),t=c.currentTime;
    // Rapid ascending tone burst — "da-da-da-DAAA"
    [0,5,9,14,19].forEach((semi,i)=>{
      const freq=330*Math.pow(2,semi/12);
      const osc=c.createOscillator();osc.type='square';osc.frequency.value=freq;
      const g=c.createGain();
      const vol=i===4?0.22:0.12; // final note louder
      const dur=i===4?0.18:0.08;
      g.gain.setValueAtTime(vol,t+i*0.07);g.gain.exponentialRampToValueAtTime(0.001,t+i*0.07+dur);
      osc.connect(g);g.connect(c.destination);osc.start(t+i*0.07);osc.stop(t+i*0.07+dur);
    });
    // Underlaying swell
    const osc2=c.createOscillator();osc2.type='sawtooth';
    osc2.frequency.setValueAtTime(110,t);osc2.frequency.exponentialRampToValueAtTime(440,t+0.45);
    const g2=c.createGain();g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(0.15,t+0.1);
    g2.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1200;
    osc2.connect(lp);lp.connect(g2);g2.connect(c.destination);osc2.start(t);osc2.stop(t+0.5);
  }

  // Stage 2 start — dramatic synth swell, scales with tier
  function stage2(tier){
    const c=init(),t=c.currentTime;
    const isEpic=tier==='epic', isBig=tier==='big';
    // Noise whomp
    const buf=mkNoise(c,1.2),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]*=Math.exp(-i/(d.length*0.25))*(0.6+0.4*Math.sin(i*0.005));
    const src=c.createBufferSource();src.buffer=buf;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=isEpic?600:350;
    const vol=isEpic?0.65:isBig?0.5:0.38;
    const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+1.2);
    src.connect(lp);lp.connect(g);g.connect(c.destination);src.start(t);src.stop(t+1.2);
    // Rising chord arpeggio
    const notes=isEpic?[55,110,165,220,330]:[110,165,220];
    notes.forEach((freq,i)=>{
      const osc=c.createOscillator();osc.type=isEpic?'sawtooth':'triangle';osc.frequency.value=freq;
      const og=c.createGain();
      og.gain.setValueAtTime(0,t+i*0.09);og.gain.linearRampToValueAtTime(isEpic?0.18:0.12,t+i*0.09+0.05);
      og.gain.exponentialRampToValueAtTime(0.001,t+i*0.09+0.5);
      osc.connect(og);og.connect(c.destination);osc.start(t+i*0.09);osc.stop(t+i*0.09+0.5);
    });
    // Epic only: deep sub thud
    if(isEpic){
      const sub=c.createOscillator();sub.type='sine';sub.frequency.setValueAtTime(60,t);sub.frequency.exponentialRampToValueAtTime(30,t+0.3);
      const sg=c.createGain();sg.gain.setValueAtTime(0.5,t);sg.gain.exponentialRampToValueAtTime(0.001,t+0.35);
      sub.connect(sg);sg.connect(c.destination);sub.start(t);sub.stop(t+0.35);
    }
  }

  function click(on){
    const c=init(),t=c.currentTime;
    const freq=on?520:380;
    const osc=c.createOscillator();osc.type='sine';osc.frequency.value=freq;
    const g=c.createGain();g.gain.setValueAtTime(0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.06);
    osc.connect(g);g.connect(c.destination);osc.start(t);osc.stop(t+0.06);
    // Subtle noise transient for tactile feel
    const buf=mkNoise(c,0.04),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]*=Math.exp(-i/(d.length*0.1));
    const src=c.createBufferSource();src.buffer=buf;
    const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=1800;
    const g2=c.createGain();g2.gain.setValueAtTime(0.06,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.04);
    src.connect(hp);hp.connect(g2);g2.connect(c.destination);src.start(t);src.stop(t+0.04);
  }

  return{zap,thunder,whoosh,win,tick,land,activate,stage2,click};
})();

// ─── RENDERER ────────────────────────────────────────────────────────────────
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

const feltCanvas=document.createElement('canvas');
feltCanvas.width=20; feltCanvas.height=20;
const fc=feltCanvas.getContext('2d');
fc.fillStyle='rgba(255,255,255,0)';fc.fillRect(0,0,20,20);
fc.strokeStyle='rgba(255,255,255,0.022)';fc.lineWidth=0.5;
fc.beginPath();fc.moveTo(0,0);fc.lineTo(20,20);fc.stroke();
fc.beginPath();fc.moveTo(20,0);fc.lineTo(0,20);fc.stroke();
const feltPattern=ctx.createPattern(feltCanvas,'repeat');

let flashAlpha=0, shakeX=0, shakeY=0, shakeDecay=0;
let boltFlash=0; // blue-white screen flash during lightning strikes
let canvasBolts=[]; // [{pts,alpha,born}]
let lightningOverlay={alpha:0,start:0}; // "⚡ LIGHTNING ⚡" canvas text
let countup={current:0,target:0,win:0,active:false,isHot:false};
let stage2Anim={active:false,start:0,duration:1300,tier:'normal'};

function drawBackground() {
  ctx.fillStyle=CONFIG.branding.backgroundColor;
  ctx.fillRect(0,0,CW,CH);
  ctx.fillStyle=feltPattern;
  ctx.fillRect(0,0,CW,CH);
  const t=Date.now()*0.0006;
  const grad=ctx.createRadialGradient(
    CW/2+Math.sin(t)*60,CH/2+Math.cos(t*.7)*40,0,CW/2,CH/2,CW*.7);
  grad.addColorStop(0,'rgba(15,30,70,0.5)');
  grad.addColorStop(.5,'rgba(10,14,35,0.25)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grad;ctx.fillRect(0,0,CW,CH);
}

function drawPins(now) {
  for (const {x,y,r,hitTime} of PINS) {
    const age=now-hitTime;
    if (age<350) {
      const t=1-age/350;
      ctx.beginPath();ctx.arc(x,y,r*3.5,0,Math.PI*2);
      ctx.fillStyle=`rgba(240,192,64,${(t*.55).toFixed(2)})`;ctx.fill();
    }
    const g=ctx.createRadialGradient(x-1.8,y-1.8,0,x,y,r+2);
    g.addColorStop(0,age<350?`rgba(255,240,180,${((1-age/350)*.6+.6).toFixed(2)})`:'#d8e8f0');
    g.addColorStop(1,age<350?'#7a6030':'#3a5060');
    ctx.beginPath();ctx.arc(x,y,r+1,0,Math.PI*2);
    ctx.fillStyle=g;ctx.fill();
  }
}

function drawSlots(slotCounts, winningNum, winGlow) {
  const slotH=CH-SLOT_TOP;
  for (let i=0;i<SLOT_N;i++) {
    const sx=i*SLOT_W, num=SLOT_NUMBERS[i];
    const isW=num===winningNum, isSel=selNums.has(num)&&winningNum===null;
    const isHot=hotNums.has(num)&&winningNum===null;
    const isLit=lightningNums.has(num)&&winningNum===null;
    const cnt=slotCounts?(slotCounts[i]||0):0;
    const isRed=RED_N.has(num), isGreen=num===0;

    if (isW)        ctx.fillStyle='rgba(240,192,64,0.10)';
    else if (isRed)  ctx.fillStyle='rgba(120,20,20,0.25)';
    else if (isGreen)ctx.fillStyle='rgba(20,90,35,0.25)';
    else             ctx.fillStyle='rgba(14,14,28,0.6)';
    ctx.fillRect(sx+1,SLOT_TOP+2,SLOT_W-2,slotH-3);

    if (isSel){ctx.fillStyle='rgba(240,192,64,0.08)';ctx.fillRect(sx+1,SLOT_TOP+2,SLOT_W-2,slotH-3);}
    // Hot slot tint
    if (isHot) {
      const pulse=0.12+0.06*Math.abs(Math.sin(Date.now()*0.006));
      ctx.fillStyle=`rgba(255,100,0,${pulse.toFixed(3)})`;
      ctx.fillRect(sx+1,SLOT_TOP+2,SLOT_W-2,slotH-3);
    }
    // Lightning multiplier slot — blue pulse
    if (isLit) {
      const pulse=0.18+0.10*Math.abs(Math.sin(Date.now()*0.007));
      ctx.fillStyle=`rgba(80,160,255,${pulse.toFixed(3)})`;
      ctx.fillRect(sx+1,SLOT_TOP+2,SLOT_W-2,slotH-3);
    }

    ctx.font='bold 8px "Exo 2",monospace';ctx.textAlign='center';
    ctx.fillStyle = isW    ? '#f0c040'
                  : isLit  ? '#88ddff'
                  : isHot  ? '#ff9900'
                  : isSel  ? '#c8a030'
                  : isRed  ? '#cc4444'
                  : isGreen? '#44cc66'
                  : '#4466aa';
    ctx.fillText(num,sx+SLOT_W/2,SLOT_TOP+13);
    // Show multiplier badge in lit slot
    if (isLit){
      ctx.font='bold 7px "Orbitron",monospace';
      ctx.fillStyle='rgba(140,220,255,0.9)';
      ctx.fillText(`${lightningNums.get(num)}×`,sx+SLOT_W/2,SLOT_TOP+22);
    }

    if (cnt>0){
      ctx.font=`bold ${cnt>9?9:11}px "Exo 2",monospace`;
      ctx.fillStyle=isW?'#f0c040':'#5577aa';
      ctx.fillText(cnt,sx+SLOT_W/2,CH-6);
    }
  }
  if (winningNum!==null&&winGlow>0) {
    const idx=NUMBER_TO_SLOT[winningNum];
    if (idx!==undefined) {
      const sx=idx*SLOT_W;
      const g=ctx.createLinearGradient(sx,SLOT_TOP,sx,CH);
      g.addColorStop(0,`rgba(240,192,64,${(winGlow*.6).toFixed(2)})`);
      g.addColorStop(1,`rgba(240,192,64,${(winGlow*.04).toFixed(2)})`);
      ctx.fillStyle=g;ctx.fillRect(sx+1,SLOT_TOP+2,SLOT_W-2,slotH-3);
    }
  }
  ctx.fillStyle='#1e2d3e';
  for (let i=0;i<=SLOT_N;i++) ctx.fillRect(i*SLOT_W,SLOT_TOP,1,slotH);
  ctx.fillStyle='#2a4055';ctx.fillRect(0,SLOT_TOP,CW,2);
}

function drawBalls(balls) {
  for (const ball of balls) {
    if (ball.removed) continue;
    const {x,y,isCascade,trail}=ball,r=BALL_R;
    for (let t=0;t<trail.length;t++) {
      const frac=(t+1)/trail.length, tr=trail[t];
      ctx.beginPath();ctx.arc(tr.x,tr.y,r*frac*.65,0,Math.PI*2);
      ctx.fillStyle=`rgba(${isCascade?'140,210,255':'220,235,255'},${(frac*.25).toFixed(2)})`;ctx.fill();
    }
    const halo=ctx.createRadialGradient(x,y,0,x,y,r*3.5);
    halo.addColorStop(0,isCascade?'rgba(120,200,255,0.32)':'rgba(255,255,255,0.32)');
    halo.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();ctx.arc(x,y,r*3.5,0,Math.PI*2);ctx.fillStyle=halo;ctx.fill();
    const surf=ctx.createRadialGradient(x-r*.38,y-r*.38,0,x,y,r);
    surf.addColorStop(0,'#ffffff');
    surf.addColorStop(.5,isCascade?'#90c8f0':'#ccdde8');
    surf.addColorStop(1,'#506878');
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=surf;ctx.fill();
  }
}

function drawParticles() {
  for (const p of particles){
    ctx.save();ctx.globalAlpha=p.life;ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.fillStyle=p.color;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r);ctx.restore();
  }
}

function drawFlash() {
  if (flashAlpha<=0) return;
  ctx.fillStyle=`rgba(240,200,80,${flashAlpha.toFixed(2)})`;ctx.fillRect(0,0,CW,CH);
}
function drawBoltFlash() {
  if (boltFlash<=0) return;
  ctx.fillStyle=`rgba(180,215,255,${boltFlash.toFixed(2)})`;ctx.fillRect(0,0,CW,CH);
}
function drawCanvasBolts(now) {
  for (const bolt of canvasBolts) {
    const life=bolt.thick?600:420;
    const age=now-bolt.born, a=Math.max(0,1-age/life);
    if (a<=0) continue;
    ctx.save();
    // Wide outer glow
    ctx.globalAlpha=a*0.55;
    ctx.strokeStyle='rgba(140,200,255,0.55)';
    ctx.lineWidth=bolt.thick?18:10;
    ctx.shadowColor='#88ccff';ctx.shadowBlur=bolt.thick?40:20;
    ctx.beginPath();ctx.moveTo(bolt.pts[0].x,bolt.pts[0].y);
    for (const p of bolt.pts) ctx.lineTo(p.x,p.y);
    ctx.stroke();
    // Mid colour band
    ctx.globalAlpha=a*0.8;
    ctx.strokeStyle='rgba(180,225,255,0.75)';
    ctx.lineWidth=bolt.thick?7:3.5;ctx.shadowBlur=bolt.thick?20:10;
    ctx.beginPath();ctx.moveTo(bolt.pts[0].x,bolt.pts[0].y);
    for (const p of bolt.pts) ctx.lineTo(p.x,p.y);
    ctx.stroke();
    // Bright white core
    ctx.globalAlpha=a;ctx.strokeStyle='#ffffff';
    ctx.lineWidth=bolt.thick?2.5:1.5;ctx.shadowBlur=8;
    ctx.beginPath();ctx.moveTo(bolt.pts[0].x,bolt.pts[0].y);
    for (const p of bolt.pts) ctx.lineTo(p.x,p.y);
    ctx.stroke();
    ctx.restore();
  }
  for (let i=canvasBolts.length-1;i>=0;i--) {
    const life=canvasBolts[i].thick?600:420;
    if (performance.now()-canvasBolts[i].born>life) canvasBolts.splice(i,1);
  }
}
function drawLightningOverlay(now) {
  if (lightningOverlay.alpha<=0) return;
  const a=lightningOverlay.alpha;
  ctx.fillStyle=`rgba(0,0,0,${(a*0.6).toFixed(2)})`;ctx.fillRect(0,0,CW,CH);
  ctx.save();
  ctx.textAlign='center';ctx.font='bold 54px "Orbitron",sans-serif';
  ctx.shadowColor='#88ccff';ctx.shadowBlur=50*a;
  ctx.fillStyle=`rgba(190,225,255,${a.toFixed(2)})`;
  ctx.fillText('⚡  MULTIPLIER  ⚡',CW/2,CH/2+18);
  ctx.restore();
}

function drawStage2Anim(now) {
  if (!stage2Anim.active) return;
  const elapsed=now-stage2Anim.start;
  const progress=Math.min(1,elapsed/stage2Anim.duration);
  const {tier}=stage2Anim;

  const overlayA=progress<.35?progress/.35:progress>.75?(1-progress)/.25:1;
  ctx.fillStyle=`rgba(0,0,0,${(overlayA*(tier==='epic'?.8:.65)).toFixed(2)})`;
  ctx.fillRect(0,0,CW,CH);

  const textProg=Math.min(1,progress/.5);
  const scale=2.2-1.2*textProg;
  const textAlpha=progress>.7?(1-progress)/.3:Math.min(1,textProg*2);

  ctx.save();
  // Epic tier: screen shake
  if (tier==='epic'&&progress<.6&&shakeDecay>0) {
    ctx.translate(shakeX,shakeY);
  }
  ctx.translate(CW/2,CH/2);ctx.scale(scale,scale);
  ctx.shadowBlur=50*(1-progress*.6);
  ctx.font=`bold 60px "Orbitron",sans-serif`;
  ctx.textAlign='center';

  if (tier==='epic') {
    // Red→gold gradient text
    const grd=ctx.createLinearGradient(-200,0,200,0);
    grd.addColorStop(0,`rgba(255,50,0,${textAlpha.toFixed(2)})`);
    grd.addColorStop(.5,`rgba(255,220,0,${textAlpha.toFixed(2)})`);
    grd.addColorStop(1,`rgba(255,50,0,${textAlpha.toFixed(2)})`);
    ctx.shadowColor='#ff4400';
    ctx.fillStyle=grd;
  } else if (tier==='big') {
    ctx.shadowColor='#f0c040';
    ctx.fillStyle=`rgba(255,220,80,${textAlpha.toFixed(2)})`;
  } else {
    ctx.shadowColor='#f0c040';
    ctx.fillStyle=`rgba(240,192,64,${textAlpha.toFixed(2)})`;
  }
  ctx.fillText('STAGE 2',0,22);
  ctx.restore();
  if (progress>=1) stage2Anim.active=false;
}

function drawCountup() {
  if (!countup.active&&countup.current<=0) return;
  ctx.save();ctx.textAlign='center';
  const v=Math.floor(countup.current);
  const flicker=countup.active?0.85+.15*Math.sin(Date.now()*.04):1;
  const col=countup.isHot?'255,140,0':'240,192,64';
  ctx.shadowColor=countup.isHot?'#ff8800':'#f0c040';ctx.shadowBlur=32*flicker;
  ctx.font='bold 56px "Orbitron",sans-serif';
  ctx.fillStyle=`rgba(${col},${flicker.toFixed(2)})`;
  ctx.fillText(`${v}×`,CW/2,CH/2-10);
  if (!countup.active){
    ctx.shadowBlur=14;
    ctx.font='bold 28px "Exo 2",sans-serif';ctx.fillStyle='#ffffff';
    ctx.fillText(`£${countup.win.toFixed(2)}`,CW/2,CH/2+32);
    if (countup.isHot){
      ctx.font='bold 14px "Orbitron",sans-serif';ctx.fillStyle='#ff8800';
      ctx.shadowColor='#ff6600';ctx.shadowBlur=12;
      ctx.fillText('🔥 HOT WIN',CW/2,CH/2+56);
    }
  }
  ctx.restore();
}

function drawMissOverlay(show) {
  if (!show) return;
  ctx.fillStyle='rgba(0,0,0,0.52)';ctx.fillRect(0,0,CW,CH);
  ctx.save();ctx.shadowColor='#ff4444';ctx.shadowBlur=40;
  ctx.font='bold 60px "Orbitron",sans-serif';
  ctx.textAlign='center';ctx.fillStyle='#ff5555';
  ctx.fillText('MISS',CW/2,CH/2+20);
  ctx.restore();
}

function renderFrame(balls,slotCounts,winningNum,winGlow,showMiss) {
  const now=performance.now();
  // Screen shake
  if (shakeDecay>0){
    shakeX=(Math.random()-.5)*shakeDecay*6;
    shakeY=(Math.random()-.5)*shakeDecay*4;
    ctx.save();ctx.translate(shakeX,shakeY);
  }
  drawBackground();drawFlash();drawBoltFlash();drawPins(now);
  drawSlots(slotCounts,winningNum,winGlow);
  drawBalls(balls);drawParticles();drawCanvasBolts(now);
  drawStage2Anim(now);drawCountup();drawMissOverlay(showMiss);
  drawLightningOverlay(now);
  if (shakeDecay>0) ctx.restore();
}

function refreshBetInfo() {
  const n=selNums.size,tot=totalBet();
  document.getElementById('bet-total').textContent=
    n===0?'£0.00':`£${tot.toFixed(2)} (${n} number${n>1?'s':''})`;

function setInteractive(on){

}
function updateBalance(){
  document.getElementById('balance-val').textContent=balance.toFixed(2);
  document.getElementById('lastwin-val').textContent=lastWin.toFixed(2);
}
function showStatus(msg){document.getElementById('status-msg').textContent=msg;}

// ─── GAME STATE ───────────────────────────────────────────────────────────────
const S={IDLE:0,BETTING:1,DROPPING:2,CASCADE:3,PAYOUT:4};
let state=S.IDLE;
let balls=[],slotCounts=new Array(37).fill(0);
let cascadeDropped=0,cascadeTimer=null,payoutShown=false;
let winGlow=0,winningNum=null,showMiss=false;

function setState(s){
  state=s;
  const on=(s===S.IDLE||s===S.BETTING);
  setInteractive(on);if(on)refreshBetInfo();updateBalance();
}

function onToggleNumber(num){
  if(state!==S.IDLE&&state!==S.BETTING)return;
  if(selNums.has(num)){
    selNums.delete(num);
    document.querySelector(`[data-num="${num}"]`).classList.remove('selected');
    Sound.click(false);
  } else {
    selNums.add(num);
    document.querySelector(`[data-num="${num}"]`).classList.add('selected');
    Sound.click(true);
  }
  if(state===S.IDLE&&selNums.size>0)setState(S.BETTING);
  else if(selNums.size===0)setState(S.IDLE);
  else refreshBetInfo();
}

function onClear(){
  if(state!==S.IDLE&&state!==S.BETTING)return;
  selNums.clear();
  document.querySelectorAll('.bet-num.selected').forEach(b=>b.classList.remove('selected'));
  setState(S.IDLE);showStatus('Select numbers and drop!');
}

function onRebet(){
  if(state!==S.IDLE&&state!==S.BETTING)return;
  if(!lastBet.nums.size)return;
  // Clear current selection first
  selNums.clear();
  document.querySelectorAll('.bet-num.selected').forEach(b=>b.classList.remove('selected'));
  // Restore last bet
  lastBet.nums.forEach(n=>{
    selNums.add(n);
    document.querySelector(`[data-num="${n}"]`)?.classList.add('selected');
  });
  stake=lastBet.stake;
  document.querySelectorAll('.stake-btn').forEach(b=>{
    b.classList.toggle('active',parseFloat(b.dataset.stake)===stake);
  });
  setState(S.BETTING);
  showStatus(`Rebet: £${(stake*selNums.size).toFixed(2)} on ${Array.from(lastBet.nums).sort((a,b)=>a-b).join(', ')}`);
}

function onDrop(){
  if(state!==S.BETTING||!canAfford())return;
  if(!placeBets()){showStatus('Insufficient balance!');return;}
  lastBet={nums:new Set(selNums),stake};
  document.getElementById('rebet-btn').disabled=false;
  resetRound();

  // Pick 1 random lightning number
  const pool=Array.from({length:37},(_,i)=>i);
  for(let i=0;i<1&&pool.length;i++){
    const idx=Math.floor(Math.random()*pool.length);
    const num=pool.splice(idx,1)[0];
    const mult=2+Math.floor(Math.random()*4); // 2–5
    lightningNums.set(num,mult);
  }

  setState(S.DROPPING);
  showStatus('⚡ Multipliers activated!');

  // Show overlay then fire bolts, then launch ball
  lightningOverlay={alpha:1,start:performance.now()};
  setTimeout(()=>{
    animateLightning(Array.from(lightningNums.entries()),0,()=>{
      showStatus('');
      Sound.whoosh();
      spawnBall(false);
    });
  },480);
}

function resetRound(){
  clearTimeout(cascadeTimer);
  balls=[];slotCounts=new Array(37).fill(0);
  cascadeDropped=0;payoutShown=false;
  winGlow=0;winningNum=null;showMiss=false;
  countup={current:0,target:0,win:0,active:false,isHot:false};
  stage2Anim.active=false;flashAlpha=0;shakeDecay=0;
  lightningNums.clear();clearLightningUI();
}

function spawnBall(isCascade){
  let x;
  if (isCascade) {
    // Spawn within row-3 pin bounds (CW/2 ± PIN_SPACING_X), center-weighted
    const ROW3_L = CW/2 - PIN_SPACING_X; // 326
    const ROW3_R = CW/2 + PIN_SPACING_X; // 474
    x = ROW3_L + ((Math.random() + Math.random()) / 2) * (ROW3_R - ROW3_L);
  } else {
    // Stage 1 uses same bounds as cascade — outer slots get no spawn advantage
    const ROW3_L = CW/2 - PIN_SPACING_X; // 326
    const ROW3_R = CW/2 + PIN_SPACING_X; // 474
    x = ROW3_L + Math.random() * (ROW3_R - ROW3_L);
    // Heat nudge: after enough misses, bias toward a selected number (clamped to same bounds)
    const {nudgeStart,maxMisses}=CONFIG.heat;
    if (consecutiveMisses>=nudgeStart&&selNums.size>0) {
      const strength=Math.min(0.5,(consecutiveMisses-nudgeStart)/(maxMisses-nudgeStart)*0.5);
      const targets=Array.from(selNums);
      const target=targets[Math.floor(Math.random()*targets.length)];
      const targetX=Math.max(ROW3_L,Math.min(ROW3_R,(NUMBER_TO_SLOT[target]+0.5)*SLOT_W));
      x=x+(targetX-x)*strength;
    }
  }
  const b=new PhysicsBall(x,GRID_TOP-14,BALL_R);
  b.isCascade=isCascade;balls.push(b);
}

function startCascade(){
  // Stake-linked drama tier
  const tier=stake>=10?'epic':stake>=5?'big':'normal';
  const duration=tier==='epic'?2000:tier==='big'?1600:1300;
  stage2Anim={active:true,start:performance.now(),duration,tier};

  if (tier==='epic'){shakeDecay=1;}
  else if (tier==='big'){flashAlpha=Math.max(flashAlpha,0.4);}
  Sound.stage2(tier);

  setTimeout(()=>{
    setState(S.CASCADE);showStatus('50 balls dropping…');
    cascadeDropped=0;payoutShown=false;
    dropNextCascade();
    setTimeout(()=>{
      if(state===S.CASCADE&&!payoutShown){payoutShown=true;showPayout();}
    },CONFIG.gameplay.stage2BallCount*CONFIG.gameplay.stage2BallInterval+5000);
  },tier==='epic'?800:600);
}

function dropNextCascade(){
  if(cascadeDropped>=CONFIG.gameplay.stage2BallCount)return;
  cascadeDropped++;spawnBall(true);
  if(cascadeDropped<CONFIG.gameplay.stage2BallCount)
    cascadeTimer=setTimeout(dropNextCascade,CONFIG.gameplay.stage2BallInterval);
}

function checkSettlement(){
  for (const ball of balls){
    if(ball.settled||ball.removed)continue;
    if(ball.y>SLOT_TOP+22){
      ball.settled=true;ball.slotIndex=getSlotIndex(ball.x);
      if(ball.isCascade)slotCounts[ball.slotIndex]++;
      Sound.land();
      setTimeout(()=>{ball.removed=true;ball.active=false;},600);
    }
  }
}

function checkStage1(){
  for (const ball of balls){
    if(ball.processed||!ball.settled||ball.isCascade)continue;
    ball.processed=true;
    const landed=SLOT_NUMBERS[ball.slotIndex];
    if(selNums.has(landed)){
      winningNum=landed;winGlow=1;flashAlpha=0.7;
      consecutiveMisses=0;updateHeatMeter();
      Sound.activate();
      setState(S.PAYOUT);
      setTimeout(startCascade,400);
    } else {
      roundNumber++;
      addHistory({round:roundNumber,landed,selected:null,hit:false,win:0,mult:0,hot:false,lightMult:1});
      consecutiveMisses++;updateHeatMeter();
      showMiss=true;setState(S.PAYOUT);
      setTimeout(()=>{ showMiss=false; fullReset(); },3000);
    }
  }
}

function checkCascadeComplete(){
  if(state!==S.CASCADE||payoutShown)return;
  if(cascadeDropped<CONFIG.gameplay.stage2BallCount)return;
  const settled=balls.filter(b=>b.isCascade&&b.settled).length;
  if(settled>=CONFIG.gameplay.stage2BallCount){payoutShown=true;setTimeout(showPayout,650);}
}

function showPayout(){
  const winSlot=NUMBER_TO_SLOT[winningNum];
  const ballsInWin=slotCounts[winSlot]||0;
  const isHot=hotNums.has(winningNum);
  const lightMult=lightningNums.get(winningNum)||1;
  const {mult,win}=calcPayout(ballsInWin,isHot,lightMult);

  roundNumber++;
  addHistory({round:roundNumber,landed:winningNum,selected:winningNum,hit:true,win,mult,hot:isHot,lightMult,ballsInSlot:ballsInWin});
  flashAlpha=0.6;winGlow=1;
  if (stake>=10){shakeDecay=0.8;}
  Sound.win();
  countup={current:0,target:mult,win,active:true,isHot,ballsInSlot:ballsInWin};
  setState(S.PAYOUT);

  const winSlotX=(winSlot+.5)*SLOT_W;
  const pCount=ballsInWin>=5?120:ballsInWin>=3?80:ballsInWin>=1?50:30;
  // Hot wins get fire particles; big stake gets extra count
  const pCols=isHot?HOT_WIN_COLS:CONFETTI_COLS;
  const pMult=stake>=10?2:stake>=5?1.5:1;
  spawnParticles(winSlotX,SLOT_TOP,Math.round(pCount*pMult),pCols);

  const bonusTags=(isHot?' 🔥':'')+(lightMult>1?` ⚡${lightMult}×`:'');
  showStatus(`${ballsInWin} ball${ballsInWin!==1?'s':''} in slot ${winningNum} — ${mult}×${bonusTags} — £${win.toFixed(2)}`);

  setTimeout(fullReset, 3000);
}

// ─── BET HISTORY ─────────────────────────────────────────────────────────────
const historyLog=[]; // max 10 entries

function addHistory(entry){
  historyLog.unshift(entry);
  if(historyLog.length>10) historyLog.pop();
  renderHistory();
}

function renderHistory(){
  const container=document.getElementById('history-rows');
  container.innerHTML='';
  historyLog.forEach((e,i)=>{
    const row=document.createElement('div');
    row.className='h-row';
    const isRed=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]).has(e.landed);
    const ballCls=e.landed===0?'green':isRed?'red':'black';
    const tags=[];
    if(e.hot) tags.push('🔥');
    if(e.lightMult>1) tags.push(`⚡${e.lightMult}×`);
    row.innerHTML=`
      <span class="h-round">#${e.round}</span>
      <span class="h-ball ${ballCls}">${e.landed}</span>
      <span class="h-landed">${e.hit?`hit ${e.selected}`:'miss'}</span>
      ${tags.length?`<span class="h-tags">${tags.map(t=>`<span>${t}</span>`).join('')}</span>`:''}
      <span class="h-result ${e.hit?'win':'miss'}">${e.hit?`£${e.win.toFixed(2)} (${e.mult}×)`:'—'}</span>`;
    container.appendChild(row);
  });
}

let roundNumber=0;

// ─── AUTOPLAY ─────────────────────────────────────────────────────────────────
let autoplay={active:false,remaining:0,rounds:10,savedNums:new Set(),savedStake:1};
let lastBet={nums:new Set(),stake:1};

function apSelectRounds(n){
  autoplay.rounds=n;
  document.querySelectorAll('.ap-btn').forEach(b=>b.classList.toggle('active',+b.dataset.rounds===n));
  document.getElementById('ap-start').disabled=false;
}

function apStart(){
  if(autoplay.active){ apStop(); return; }
  if(selNums.size===0){ showStatus('Select numbers first!'); return; }
  autoplay.active=true;
  autoplay.remaining=autoplay.rounds;
  autoplay.savedNums=new Set(selNums);
  autoplay.savedStake=stake;
  const btn=document.getElementById('ap-start');
  btn.textContent='■ Stop';btn.classList.add('stopping');
  // Tell the player exactly what will repeat
  const numList=Array.from(autoplay.savedNums).join(', ');
  showStatus(`Autoplay: repeating £${autoplay.savedStake} on ${numList} × ${autoplay.rounds} rounds`);
  setTimeout(apDropNext,800);
}

function apStop(){
  autoplay.active=false;autoplay.remaining=0;
  const btn=document.getElementById('ap-start');
  btn.textContent='▶ Start';btn.classList.remove('stopping');
  showStatus('Autoplay stopped.');
}

function apDropNext(){
  if(!autoplay.active||autoplay.remaining<=0){ apStop(); return; }
  // Restore selections for this round
  selNums.clear();
  document.querySelectorAll('.bet-num.selected').forEach(b=>b.classList.remove('selected'));
  autoplay.savedNums.forEach(n=>{
    selNums.add(n);
    document.querySelector(`[data-num="${n}"]`)?.classList.add('selected');
  });
  stake=autoplay.savedStake;
  if(state===S.IDLE||state===S.BETTING){
    setState(S.BETTING);
    autoplay.remaining--;
    showStatus(`Autoplay: ${autoplay.remaining+1} round${autoplay.remaining?'s':''} left`);
    onDrop();
  }
}

function fullReset(){
  // Clear all balls and visual state
  winGlow=0;balls=[];slotCounts=new Array(37).fill(0);winningNum=null;shakeDecay=0;showMiss=false;
  // Clear selections
  selNums.clear();
  document.querySelectorAll('.bet-num.selected').forEach(b=>b.classList.remove('selected'));
  // Clear lightning multipliers
  lightningNums.clear();clearLightningUI();
  // Clear hot highlights
  hotNums.forEach(n=>document.querySelector(`[data-num="${n}"]`)?.classList.remove('hot'));
  hotNums.clear();hotExpiry=0;
  document.getElementById('hot-ref').style.display='none';
  setState(S.IDLE);
  if(autoplay.active&&autoplay.remaining>0){
    showStatus(`Autoplay: ${autoplay.remaining} round${autoplay.remaining!==1?'s':''} left`);
    setTimeout(apDropNext,600);
  } else {
    if(autoplay.active) apStop();
    showStatus('Select numbers and drop!');
  }
}

// ─── GAME LOOP ────────────────────────────────────────────────────────────────
function gameLoop(){
  stepPhysics(balls,PINS,RECTS);
  checkSettlement();checkStage1();
  if(state===S.CASCADE)checkCascadeComplete();

  if(flashAlpha>0) flashAlpha=Math.max(0,flashAlpha-0.035);
  if(boltFlash>0) boltFlash=Math.max(0,boltFlash-0.038);
  if(lightningOverlay.alpha>0){
    const age=performance.now()-lightningOverlay.start;
    if(age>320) lightningOverlay.alpha=Math.max(0,lightningOverlay.alpha-0.03);
  }
  if(shakeDecay>0) shakeDecay=Math.max(0,shakeDecay-0.04);
  if(winGlow>0&&(state===S.CASCADE||state===S.PAYOUT))
    winGlow=0.55+.45*Math.abs(Math.sin(Date.now()*.0045));
  if(countup.active){
    countup.current=Math.min(countup.target,countup.current+countup.target/45);
    if(countup.current>=countup.target)countup.active=false;
  }
  updateParticles();
  renderFrame(balls,slotCounts,winningNum,winGlow,showMiss);
  requestAnimationFrame(gameLoop);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
buildBetTable();buildStakeButtons();
document.getElementById('drop-btn').addEventListener('click',onDrop);
document.getElementById('clear-btn').addEventListener('click',onClear);
document.getElementById('rebet-btn').addEventListener('click',onRebet);
// Autoplay controls
apSelectRounds(10); // default selection
document.getElementById('autoplay-btns').addEventListener('click',e=>{
  const btn=e.target.closest('.ap-btn');
  if(btn)apSelectRounds(+btn.dataset.rounds);
});
document.getElementById('ap-start').addEventListener('click',apStart);
setState(S.IDLE);showStatus('Select numbers and drop!');
scheduleNextHot();
requestAnimationFrame(gameLoop);
</script>
